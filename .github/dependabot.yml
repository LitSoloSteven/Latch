version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Managua
    open-pull-requests-limit: 3
    labels: ['tipo:tarea', 'módulo:M12']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Managua
    open-pull-requests-limit: 3
    labels: ['tipo:tarea', 'módulo:M12']
